<!DOCTYPE html>
<html>
<head>
    <title>PetCare PRO</title>
</head>
<body>

<h1>🐶 PetCare PRO</h1>

<!-- LOGIN -->
<h2>Login</h2>
<input id="user" placeholder="usuario">
<input id="pass" placeholder="contraseña">
<button onclick="login()">Login</button>
<button onclick="register()">Registro</button>

<hr>

<!-- MASCOTAS -->
<h2>Crear mascota</h2>
<input id="nombre" placeholder="nombre">
<input id="edad" placeholder="edad">
<input id="raza" placeholder="raza">
<button onclick="crear()">Crear</button>

<h2>Mis mascotas</h2>
<ul id="lista"></ul>

<script>

const API = window.location.origin;

// LOGIN
async function login(){
    await fetch(API+"/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username: user.value,
            password: pass.value
        })
    })
    cargar();
}

// REGISTER
async function register(){
    await fetch(API+"/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username: user.value,
            password: pass.value
        })
    })
}

// CREAR MASCOTA
async function crear(){
    await fetch(API+"/mascotas", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            nombre:nombre.value,
            edad:edad.value,
            raza:raza.value
        })
    })
    cargar();
}

// LISTAR
async function cargar(){
    const res = await fetch(API+"/mascotas");
    const data = await res.json();

    lista.innerHTML="";

    data.forEach(m=>{
        let li = document.createElement("li");
        li.textContent = m[2]+" - "+m[3]+" - "+m[4];
        lista.appendChild(li);
    });
}

cargar();

</script>

</body>
</html>
