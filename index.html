<!DOCTYPE html>
<html>
<head>
    <title>PetCare</title>
</head>
<body>

<h1>🐶 PetCare</h1>

<!-- CREAR MASCOTA -->
<h2>Crear mascota</h2>

<input id="nombre" placeholder="Nombre">
<input id="edad" placeholder="Edad">
<input id="raza" placeholder="Raza">

<button onclick="guardar()">Guardar mascota</button>

<hr>

<!-- VACUNAS -->
<h2>💉 Agregar vacuna</h2>

<input id="nombreVacuna" placeholder="Nombre mascota">
<input id="vacuna" placeholder="Vacuna">

<button onclick="agregarVacuna()">Agregar vacuna</button>

<hr>

<!-- EDITAR -->
<h2>✏️ Editar mascota</h2>

<input id="edit_actual" placeholder="Nombre actual">
<input id="edit_nuevo" placeholder="Nuevo nombre">
<input id="edit_edad" placeholder="Nueva edad">
<input id="edit_raza" placeholder="Nueva raza">

<button onclick="editarMascota()">Editar mascota</button>

<hr>

<!-- LISTA -->
<h2>🐾 Mascotas</h2>
<ul id="lista"></ul>

<!-- ALERTAS -->
<h2>⚠️ Recordatorios</h2>
<ul id="alertas"></ul>

<script>

// 🔥 conexión automática con Render
const API = window.location.origin;

// CREAR MASCOTA
async function guardar() {
    const nombre = document.getElementById("nombre").value;
    const edad = document.getElementById("edad").value;
    const raza = document.getElementById("raza").value;

    await fetch(API + "/mascotas", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nombre, edad, raza })
    });

    cargar();
}

// AGREGAR VACUNA
async function agregarVacuna() {
    const nombre = document.getElementById("nombreVacuna").value;
    const vacuna = document.getElementById("vacuna").value;

    await fetch(API + "/vacunas", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nombre, vacuna })
    });

    cargar();
}

// EDITAR MASCOTA
async function editarMascota() {
    const nombre_actual = document.getElementById("edit_actual").value;
    const nuevo_nombre = document.getElementById("edit_nuevo").value;
    const nueva_edad = document.getElementById("edit_edad").value;
    const nueva_raza = document.getElementById("edit_raza").value;

    await fetch(API + "/editar_mascota", {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            nombre_actual,
            nuevo_nombre,
            nueva_edad,
            nueva_raza
        })
    });

    cargar();
}

// CARGAR MASCOTAS
async function cargar() {
    const res = await fetch(API + "/mascotas");
    const data = await res.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    data.forEach(m => {
        const li = document.createElement("li");

        let texto = m.nombre + " - " + m.edad + " - " + m.raza;

        if (m.vacunas.length > 0) {
            texto += " | Vacunas: ";
            m.vacunas.forEach(v => {
                texto += v.vacuna + " (próx: " + v.proxima + ") ";
            });
        }

        li.textContent = texto;
        lista.appendChild(li);
    });

    cargarAlertas();
}

// ALERTAS
async function cargarAlertas() {
    const res = await fetch(API + "/recordatorios");
    const data = await res.json();

    const lista = document.getElementById("alertas");
    lista.innerHTML = "";

    data.forEach(a => {
        const li = document.createElement("li");
        li.textContent = a.mascota + " - " + a.vacuna + " (" + a.estado + ")";
        lista.appendChild(li);
    });
}

cargar();

</script>

</body>
</html>
